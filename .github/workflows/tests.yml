name: Tests

# Pruebas en Windows real: cmd.exe, Windows PowerShell 5.1 y los helpers de Chocolatey del runner.
# No publica nada: choco es un falso (tests/fakes/FakeChoco.cs), no hay secretos y Git solo sube a un
# repositorio temporal. Nunca ejecuta Scripts/update_all.bat contra Chocolatey ni el workflow de publicacion.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a un PR cancela la ejecucion anterior de ese PR; lanzado a mano, cada
# ejecucion va en su propio grupo y termina completa.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La imagen trae Pester 3.4, que no entiende la sintaxis de Pester 5
      - name: Install Pester and PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      # Los .ps1/.psm1/.psd1 y, aparte, la parte PowerShell de cada Scripts\*.bat (lo que va detras de
      # "### POWERSHELL ###", con la cabecera como lineas vacias: la linea es la del .bat)
      - name: PSScriptAnalyzer (cero avisos)
        shell: powershell
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $settings = '.\tests\PSScriptAnalyzerSettings.psd1'
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settings | Select-Object RuleName, ScriptName, Line, Message)
          . .\Scripts\lib\Lanzar.ps1
          foreach ($bat in Get-ChildItem -Path .\Scripts -Filter *.bat) {
            if (-not (Select-String -LiteralPath $bat.FullName -Pattern '^### POWERSHELL ###\s*$' -Quiet)) { continue }
            $findings += @(Invoke-ScriptAnalyzer -ScriptDefinition (Get-ChocoSeccionBat -Ruta $bat.FullName -Texto) -Settings $settings |
              Select-Object RuleName, @{ Name = 'ScriptName'; Expression = { $bat.Name } }, Line, Message)
          }
          $findings | Format-Table RuleName, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
          if ($findings) { exit 1 }

      - name: Pester
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = '.\tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
