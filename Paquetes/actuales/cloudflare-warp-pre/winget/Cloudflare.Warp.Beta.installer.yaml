# Template of update_all.ps1 (README, "winget"): the values in double braces are filled in for each version
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.28.0.schema.json

PackageIdentifier: Cloudflare.Warp.Beta
PackageVersion: "{{Version}}"
InstallerType: wix
Scope: machine
InstallerSwitches:
  InstallLocation: INSTALLFOLDER="<INSTALLPATH>"
UpgradeBehavior: install
Installers:
- Architecture: x64
  InstallerUrl: {{x64.Url}}
  InstallerSha256: {{x64.Sha256}}
ManifestType: installer
ManifestVersion: 1.28.0
