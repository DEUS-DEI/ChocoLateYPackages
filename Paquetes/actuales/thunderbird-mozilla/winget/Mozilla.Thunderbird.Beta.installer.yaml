# Template of update_all.ps1 (README, "winget"): the values in double braces are filled in for each version
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.28.0.schema.json
# Same installer settings as Mozilla.Thunderbird; Mozilla names the Apps & Features entry after the version

PackageIdentifier: Mozilla.Thunderbird.Beta
PackageVersion: "{{Version}}"
InstallerLocale: en-US
InstallerType: nullsoft
Scope: machine
InstallModes:
- interactive
- silent
InstallerSwitches:
  Silent: /S /PreventRebootRequired=true
  SilentWithProgress: /S /PreventRebootRequired=true
  InstallLocation: /InstallDirectoryPath="<INSTALLPATH>"
UpgradeBehavior: install
Protocols:
- mailto
- mid
- webcal
- webcals
FileExtensions:
- eml
- ics
- wdseml
Installers:
- Architecture: x86
  InstallerUrl: {{x86.Url}}
  InstallerSha256: {{x86.Sha256}}
  ProductCode: Mozilla Thunderbird {{Version}} (x86 en-US)
- Architecture: x64
  InstallerUrl: {{x64.Url}}
  InstallerSha256: {{x64.Sha256}}
  ProductCode: Mozilla Thunderbird {{Version}} (x64 en-US)
ManifestType: installer
ManifestVersion: 1.28.0
